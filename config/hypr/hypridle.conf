# Idle management (laptops). Started from hyprland.lua only when a battery is present.
# Install: sudo apt install hypridle   (or your distro's package)

general {
    lock_cmd       = pidof hyprlock || hyprlock   # avoid stacking lockers
    before_sleep_cmd = loginctl lock-session       # lock before suspend
    after_sleep_cmd  = hyprctl dispatch dpms on    # wake displays on resume
}

# Dim backlight after 2.5 min
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10
    on-resume  = brightnessctl -r
}

# Lock after 5 min
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Screens off after 6 min
listener {
    timeout = 360
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}

# Suspend after 15 min
listener {
    timeout = 900
    on-timeout = systemctl suspend
}
